{% extends "base.html" %}
{% block title %}Admin — Provenova{% endblock %}

{% block content %}
<div class="mb-4">
  <h1 class="text-2xl font-bold text-slate-900">Superadmin console</h1>
  <p class="text-sm text-slate-500">Every organization on this instance.</p>
</div>

<div class="overflow-x-auto rounded-xl border border-slate-200 bg-white">
  <table class="min-w-full text-sm">
    <thead class="bg-slate-50 text-slate-500 text-left">
      <tr>
        <th class="px-4 py-2 font-medium">Org</th>
        <th class="px-4 py-2 font-medium">Slug</th>
        <th class="px-4 py-2 font-medium">Trust Center</th>
      </tr>
    </thead>
    <tbody class="divide-y divide-slate-100">
      {% for org in orgs %}
      <tr class="hover:bg-slate-50">
        <td class="px-4 py-2 text-slate-800">{{ org.name }}</td>
        <td class="px-4 py-2 mono text-slate-500">{{ org.slug }}</td>
        <td class="px-4 py-2"><a href="/trust/{{ org.slug }}" class="text-indigo-600 hover:underline">/trust/{{ org.slug }}</a></td>
      </tr>
      {% else %}
      <tr><td colspan="3" class="px-4 py-6 text-center text-slate-400">No orgs.</td></tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
