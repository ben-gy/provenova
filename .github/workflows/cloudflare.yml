name: cloudflare

# Test, build and deploy Provenova to Cloudflare (Worker + Container).
#
#   test   — the pytest suite.
#   image  — builds the production container image and proves the SQLite ->
#            Litestream -> object-storage round trip (s3mock standing in for R2):
#            write, stop the container, start a fresh one, read it back.
#   deploy — main only, after both pass: `wrangler deploy` (builds + pushes the
#            image to Cloudflare's registry and rolls the container).
#
# Repository secrets for deploy (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   — see deploy/HOSTING-cloudflare.md for its permissions
#   CLOUDFLARE_ACCOUNT_ID

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - README.md
      - CONTRIBUTING.md
      - CLA.md
      - routines/**
      - .github/workflows/cla.yml
      - .github/workflows/growth.yml
  workflow_dispatch:

concurrency:
  group: cloudflare-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -c deploy/requirements.lock -e packages/ql-core -e "packages/ql-sdk[aer]" \
            -e packages/ql-crawler -e server pytest
      - name: pytest
        run: python -m pytest

  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - name: Build image
        run: docker build -f deploy/cloudflare/Dockerfile -t provenova:ci .
      - name: Start S3 mock (R2 stand-in)
        run: |
          # MinIO no longer publishes images; s3mock creates the bucket itself
          # and ignores credentials.
          docker run -d --name s3 --network host \
            -e COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS=provenova-db \
            adobe/s3mock@sha256:ab01a6946750f451ca215a47e91030695b260e4003b8a5a6201d25029b8fca92
          for i in $(seq 60); do curl -fs http://127.0.0.1:9090/ >/dev/null && break; sleep 1; done
      - name: Persistence round trip
        run: |
          set -eu
          start() {
            docker run -d --name app --network host \
              -e QL_SECRET_KEY="$(openssl rand -hex 32)" -e QL_BASE_URL=http://127.0.0.1:8000 \
              -e CLOUDFLARE_ACCOUNT_ID=ci -e LITESTREAM_BUCKET=provenova-db -e LITESTREAM_PATH=ci \
              -e LITESTREAM_ACCESS_KEY_ID=ci-access -e LITESTREAM_SECRET_ACCESS_KEY=ci-secret-key \
              -e LITESTREAM_ENDPOINT=http://127.0.0.1:9090 -e LITESTREAM_REGION=us-east-1 \
              provenova:ci
            for i in $(seq 90); do
              curl -fs http://127.0.0.1:8000/api/v1/health >/dev/null && return 0
              sleep 2
            done
            docker logs app; return 1
          }
          creds='{"email":"ci@example.com","password":"ci-password-123"}'

          start
          curl -fsS -X POST -H 'Content-Type: application/json' -d "$creds" \
            http://127.0.0.1:8000/api/v1/auth/register
          echo
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/pricing)" = 301
          sleep 3                      # > Litestream sync-interval
          docker stop -t 30 app        # SIGTERM -> final sync to the S3 mock
          docker logs app 2>&1 | tail -20
          docker rm app

          start                        # fresh disk: must restore from the S3 mock
          docker logs app 2>&1 | grep -i restor || true
          curl -fsS -X POST -H 'Content-Type: application/json' -d "$creds" \
            http://127.0.0.1:8000/api/v1/auth/login
          echo
          docker stop -t 30 app
      - name: Refuses to boot without replication
        run: |
          if docker run --rm -e QL_SECRET_KEY=x provenova:ci; then
            echo "container started without Litestream config"; exit 1
          fi

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [test, image]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: cloudflare-deploy
      cancel-in-progress: false
    defaults:
      run:
        working-directory: cloudflare
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cloudflare/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - name: wrangler deploy
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
